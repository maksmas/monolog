version: 2

project_name: monolog

builds:
  - id: monolog
    binary: monolog
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/mmaksmas/monolog/cmd.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - name: monolog
    repository:
      owner: mmaksmas
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/mmaksmas/monolog"
    description: "A CLI personal backlog tool with a git-backed, conflict-free store and an interactive TUI"
    license: "MIT"
    test: |
      system "#{bin}/monolog --version"
    install: |
      bin.install "monolog"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge "
